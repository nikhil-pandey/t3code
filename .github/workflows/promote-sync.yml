name: Promote upstream sync

on:
  schedule:
    - cron: "47 * * * *"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [automation/upstream-sync]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.repository == 'nikhil-pandey/t3code' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate current sync and merge through GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/upstream-sync/promote.mjs
