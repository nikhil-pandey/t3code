name: Sync upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'nikhil-pandey/t3code' && github.ref == 'refs/heads/main'
    environment: upstream-sync
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Prepare sync PR and dispatch CI
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_WORKFLOW_TOKEN_AVAILABLE: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
        run: node tools/upstream-sync/sync.mjs
